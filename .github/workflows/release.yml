name: Publish to crates.io

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: CARGO_REGISTRY_TOKEN
    permissions:
      contents: read
      id-token: write
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - name: Test
        run: cargo test --locked

      - name: Require the tag to match the crate version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "r3vu") | .version')"
          test "$tag" = "$version"

      # r3vu is a new crate. The first tag needs the API token, or a Trusted
      # Publisher registered for r3vu on Pulko/p0 and this file. The publisher
      # already used for p0-ide does not cover the new name.
      - name: Sign in with trusted publishing
        id: auth
        if: env.CARGO_REGISTRY_TOKEN == ''
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ env.CARGO_REGISTRY_TOKEN || steps.auth.outputs.token }}

[package]
name = "r3vu"
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
description = "A mouse-driven terminal IDE for TypeScript and JavaScript on macOS."
license = "MIT OR Apache-2.0"
repository = "https://github.com/Pulko/p0"
readme = "README.md"
keywords = ["editor", "terminal", "typescript", "ide"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "r3vu"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
arboard = "3.7.0"
crossterm = { version = "0.29.0", features = ["event-stream"] }
dirs = "7.0.0"
futures = "0.3.34"
ignore = "0.4.34"
libc = "0.2"
notify = "8.2.2"
nucleo = "0.5.0"
pulldown-cmark = "0.13"
ratatui = "0.30.2"
ropey = "1.6.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
similar = "3.2.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = "0.7.20"
toml = "1.2.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tree-sitter = "0.27.2"
tree-sitter-css = "0.25.0"
tree-sitter-html = "0.23.2"
tree-sitter-javascript = "0.25.0"
tree-sitter-json = "0.24.8"
tree-sitter-md = "0.5.4"
tree-sitter-typescript = "0.23.2"
tree-sitter-yaml = "0.7.2"
unicode-segmentation = "1.13.3"
unicode-width = "0.2.3"
uuid = { version = "1.29.1", features = ["v4"] }
which = "8.0.6"
